name: AI Finance OS CI Pipeline

on:
  push:
    branches: [ master, main, 'feature/*', 'cursor/*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test-matrix:
    name: Backend Pytest & Code Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: financeos
          POSTGRES_PASSWORD: financeos_test_password
          POSTGRES_DB: financeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install poetry==1.8.5 bandit
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: Run Code Security Linter (Bandit)
        working-directory: ./backend
        run: |
          bandit -r app/ -s B101,B104 || true

      - name: Execute Pytest Domain Integration Suite
        working-directory: ./backend
        env:
          APP_ENV: testing
          LOG_LEVEL: INFO
          DATABASE_URL: postgresql+asyncpg://financeos:financeos_test_password@localhost:5432/financeos
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ORIGINS: http://localhost:5173
          PYTHONPATH: .
        run: |
          pytest tests/

  frontend-build-matrix:
    name: Frontend Build & Typecheck Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript Typecheck & Production Build
        working-directory: ./frontend
        run: npm run build
