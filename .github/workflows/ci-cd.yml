name: SarvaFlow Production CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend Pytest Suite & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute Pytest Test Suite & CI Regression Gates
        working-directory: ./backend
        env:
          PYTHONPATH: .
          APP_ENV: testing
          LOG_LEVEL: INFO
        run: |
          pytest -v

  frontend-ci:
    name: Frontend TypeScript Verification & Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: TypeScript Type Check (tsc --noEmit)
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Vite Production Bundle Build
        working-directory: ./frontend
        run: |
          npx vite build

  vercel-deploy:
    name: Deploy Frontend to Vercel Production
    needs: [frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Vercel Production Deployment
        run: |
          echo "✓ Frontend CI verification clean. Triggering Vercel deployment..."

  build-and-push-containers:
    name: Build & Push Docker Container Images to GHCR
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner for Docker Registry
        id: repo
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/sarvaflow-backend:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/sarvaflow-backend:${{ github.sha }}

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/sarvaflow-frontend:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/sarvaflow-frontend:${{ github.sha }}
