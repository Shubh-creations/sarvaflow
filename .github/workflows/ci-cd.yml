name: SarvaFlow CI/CD Pipeline & Automated Regression Gate

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Test Suite & Automated Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install poetry==1.8.5
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: Run Full Pytest Suite & Prompt-Injection Regression Gate
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          pytest -v

  frontend-ci:
    name: Frontend Type Check & Production Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run TypeScript Verification (tsc --noEmit)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Vite Production Bundle
        run: |
          cd frontend
          npx vite build

  staging-deploy:
    name: Deploy to Staging Environment (Render + Vercel)
    needs: [backend-ci, frontend-ci]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Staging Backend Deploy
        run: |
          echo "✓ Verification checks passed. Triggering Render Backend Staging Deploy..."
          # curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

      - name: Trigger Vercel Staging Frontend Deploy
        run: |
          echo "✓ Verification checks passed. Triggering Vercel Frontend Staging Deploy..."
          # npx vercel --token ${{ secrets.VERCEL_TOKEN }} --env staging

  production-deploy:
    name: Deploy to Production Beta Launch
    needs: [staging-deploy]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Production Deploy Hooks
        run: |
          echo "✓ Staging verification clean. Deploying to Production Beta Launch..."
