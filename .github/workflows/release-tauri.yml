name: SarvaFlow Desktop Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri-desktop:
    name: Build & Publish Tauri Desktop Installers (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies & Build Bundle
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Build & Package Desktop Installers (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'SarvaFlow Desktop ${{ github.ref_name }}'
          releaseBody: 'Production Cross-Platform Desktop Installers for SarvaFlow Enterprise AI Finance OS.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
